version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raizul-forest-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GFW_API_KEY=092d42cf-281d-4da1-a7c6-96a9ecff6cb4
      - GFW_ORIGIN_HEADER=https://www.globalforestwatch.org
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raizul-forest-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped